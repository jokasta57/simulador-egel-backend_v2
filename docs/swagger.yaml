                          type: string
                          example: "García"
                        calificacion:
                          type: string
                          example: "85.50"
                        total_intentos:
                          type: integer
                          example: 2
                  resumen:
                    type: object
                    properties:
                      promedio_general:
                        type: string
                        example: "78.50"
                      total_estudiantes:
                        type: integer
                        example: 50
                      tasa_aprobacion:
                        type: string
                        example: "75.00"
                      distribucion_calificaciones:
                        type: array
                        items:
                          type: object
                          properties:
                            rango:
                              type: string
                              example: "81-100"
                            cantidad:
                              type: integer
                              example: 20
                      aprobacion:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
