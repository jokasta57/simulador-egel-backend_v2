openapi: 3.0.0
info:
  title: API de Administradores, Estudiantes, Exámenes, Preguntas y Opciones
  description: API para gestionar administradores, estudiantes, exámenes, preguntas y opciones en el sistema
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Servidor local de desarrollo

# Define all components in the main file
components:
  schemas:
    Examen:
      type: object
      properties:
        id_examen:
          type: integer
          description: ID único del examen
          example: 1
        carrera:
          type: string
          description: Carrera o área del examen
          example: "Ingeniería en Sistemas"
        nombre:
          type: string
          description: Nombre del examen
          example: "Examen de Matemáticas"
        periodo:
          type: string
          description: Periodo o ciclo en el que se aplica el examen
          example: "2025-1"
        duracion:
          type: string
          format: time
          description: Duración del examen en formato de hora (hh:mm:ss)
          example: "02:00:00"
        fecha_modificacion:
          type: string
          format: date
          description: Fecha de la última modificación del examen
          example: "2025-01-15"
        estado:
          type: string
          description: Estado del examen (activo o borrador)
          enum:
          - "activo"
          - "borrador"
          example: "activo"
        area:
          type: string
          description: Área asociada al examen (opcional)
          example: "Matemáticas"

    Pregunta:
      type: object
      properties:
        id_pregunta:
          type: integer
          description: ID único de la pregunta
          example: 1
        contenido:
          type: string
          description: Enunciado de la pregunta
          example: "¿Cuál es la capital de Francia?"
        imagen_url:
          type: string
          description: URL de la imagen asociada a la pregunta
          example: "https://res.cloudinary.com/example/image/upload/v1234567890/imagenes_preguntas/abcdef.jpg"
        orden:
          type: integer
          description: Orden de la pregunta en el examen
          example: 1
        id_examen:
          type: integer
          description: ID del examen al que pertenece la pregunta
          example: 1

    Opcion:
      type: object
      properties:
        id_opcion:
          type: integer
          description: ID único de la opción
          example: 1
        contenido:
          type: string
          description: Texto de la opción
          example: "París"
        es_correcta:
          type: boolean
          description: Indica si la opción es correcta
          example: true
        imagen_url:
          type: string
          description: URL de la imagen asociada a la opción
          example: "https://res.cloudinary.com/example/image/upload/v1234567890/imagenes_opciones/abcdef.jpg"
        id_pregunta:
          type: integer
          description: ID de la pregunta a la que pertenece la opción
          example: 1

    Estudiante:
      type: object
      properties:
        numero_cuenta:
          type: string
          description: Número de cuenta del estudiante
          example: "20180123"
        nombre:
          type: string
          description: Nombre del estudiante
          example: "Juan"
        apellido_paterno:
          type: string
          description: Apellido paterno del estudiante
          example: "Pérez"
        apellido_materno:
          type: string
          description: Apellido materno del estudiante
          example: "García"
        email:
          type: string
          description: Correo electrónico del estudiante
          example: "juan.perez@example.com"
        carrera:
          type: string
          description: Carrera que estudia el estudiante
          example: "Ingeniería en Sistemas"
        semestre:
          type: integer
          description: Semestre que cursa el estudiante
          example: 5
        grupo:
          type: string
          description: Grupo al que pertenece el estudiante
          example: "A"
        ciclo_escolar:
          type: string
          description: Ciclo escolar actual
          example: "2025-1"

    Admin:
      type: object
      properties:
        id_admin:
          type: integer
          description: ID único del administrador
          example: 1
        nombre:
          type: string
          description: Nombre del administrador
          example: "Admin"
        apellido_paterno:
          type: string
          description: Apellido paterno del administrador
          example: "Pérez"
        apellido_materno:
          type: string
          description: Apellido materno del administrador
          example: "García"
        numero_identificacion:
          type: string
          description: Número de identificación del administrador
          example: "A12345"
        carrera:
          type: string
          description: Carrera que administra
          example: "Ingeniería en Sistemas"

    Respuesta:
      type: object
      properties:
        id_respuesta:
          type: integer
          description: ID único de la respuesta
          example: 1
        id_opcion:
          type: integer
          description: ID de la opción seleccionada
          example: 2
        id_intento:
          type: integer
          description: ID del intento de examen
          example: 3
        es_correcta:
          type: boolean
          description: Indica si la respuesta es correcta
          example: true

    Intento:
      type: object
      properties:
        id_intento:
          type: integer
          description: ID único del intento
          example: 1
        numero_cuenta:
          type: string
          description: Número de cuenta del estudiante
          example: "20180123"
        id_examen:
          type: integer
          description: ID del examen
          example: 2
        fecha_aplicacion:
          type: string
          format: date-time
          description: Fecha y hora de aplicación del examen
          example: "2025-01-15T10:30:00Z"
        calificacion:
          type: number
          description: Calificación obtenida en el examen
          example: 85.5

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Indica si la operación fue exitosa
          example: false
        msg:
          type: string
          description: Mensaje de error
          example: "Error en el servidor"

    SuccessResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        msg:
          type: string
          description: Mensaje de éxito
          example: "Operación realizada con éxito"

  parameters:
    idParam:
      name: id
      in: path
      required: true
      description: ID del recurso
      schema:
        type: string

    ExamenId:
      name: id
      in: path
      required: true
      description: ID del examen
      schema:
        type: integer

    RespuestaId:
      name: id
      in: path
      required: true
      description: ID de la respuesta
      schema:
        type: string

    imagenIdParam:
      name: id
      in: path
      required: true
      description: ID de la imagen a eliminar
      schema:
        type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

# Define all paths
paths:
  # Auth paths
  /admin:
    post:
      summary: Crear un nuevo administrador
      description: Solo un `superAdmin` puede crear administradores
      tags:
      - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre del administrador
                  example: "Juan"
                apellido_paterno:
                  type: string
                  description: Apellido paterno del administrador
                  example: "Pérez"
                apellido_materno:
                  type: string
                  description: Apellido materno del administrador
                  example: "Gómez"
                numero_identificacion:
                  type: string
                  description: Número de identificación único
                  example: "123456789"
                nip:
                  type: string
                  description: NIP del administrador
                  example: "1234"
                carrera:
                  type: string
                  description: Carrera que administra
                  example: "Ingeniería"
      responses:
        '201':
          description: Administrador creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: string
                    example: "Administrador creado exitosamente"
                  admin:
                    $ref: '#/components/schemas/Admin'
        '409':
          description: El administrador ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 409
                  msg:
                    type: string
                    example: "Este usuario ya existe"
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/auth:
    post:
      summary: Autenticación de administrador
      description: Iniciar sesión como administrador
      tags:
      - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numero_identificacion:
                  type: string
                  description: Número de identificación del administrador
                  example: "123456789"
                nip:
                  type: string
                  description: NIP del administrador
                  example: "1234"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Usuario autenticado exitosamente"
                  token:
                    type: string
                    example: "jwt-token"
                  admin:
                    $ref: '#/components/schemas/Admin'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: "Verifica tus credenciales e intenta de nuevo."
                  token:
                    type: null
                    example: null
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "El usuario no está registrado"
                  token:
                    type: null
                    example: null
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/renew:
    get:
      summary: Renovar token de autenticación
      description: Renovar el token JWT para mantener la sesión activa
      tags:
      - Autenticación
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: "jwt-token-renovado"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin-password:
    put:
      summary: Actualizar contraseña de administrador
      description: Cambiar la contraseña del administrador autenticado
      tags:
      - Autenticación
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numero_identificacion:
                  type: string
                  description: Número de identificación del administrador
                  example: "123456789"
                nip_actual:
                  type: string
                  description: NIP actual
                  example: "1234"
                nip_nuevo:
                  type: string
                  description: Nuevo NIP
                  example: "5678"
      responses:
        '200':
          description: Contraseña actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Contraseña actualizada exitosamente"
        '401':
          description: NIP actual incorrecto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: "Verifica tu NIP actual e intenta de nuevo."
                  token:
                    type: null
                    example: null
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "El usuario no está registrado"
                  token:
                    type: null
                    example: null
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Student paths
  /students:
    post:
      summary: Crear un nuevo estudiante
      description: Registrar un nuevo estudiante en el sistema
      tags:
      - Estudiantes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre del estudiante
                  example: "Pedro"
                apellido_paterno:
                  type: string
                  description: Apellido paterno del estudiante
                  example: "García"
                apellido_materno:
                  type: string
                  description: Apellido materno del estudiante
                  example: "López"
                email:
                  type: string
                  description: Correo electrónico del estudiante
                  example: "pedro.garcia@example.com"
                numero_cuenta:
                  type: string
                  description: Número de cuenta del estudiante
                  example: "20180123"
                carrera:
                  type: string
                  description: Carrera que estudia el estudiante
                  example: "Ingeniería"
                semestre:
                  type: integer
                  description: Semestre que cursa el estudiante
                  example: 5
                grupo:
                  type: string
                  description: Grupo al que pertenece el estudiante
                  example: "A"
                ciclo_escolar:
                  type: string
                  description: Ciclo escolar actual
                  example: "2025-1"
                nip:
                  type: string
                  description: NIP del estudiante
                  example: "1234"
      responses:
        '201':
          description: Estudiante creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: string
                    example: "Estudiante registrado exitosamente"
                  token:
                    type: string
                    example: "jwt-token"
                  estudiante:
                    $ref: '#/components/schemas/Estudiante'
        '409':
          description: El estudiante ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 409
                  msg:
                    type: string
                    example: "El número de cuenta ya está registrado. Por favor, verifique sus datos."
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /students/{id}:
    get:
      summary: Obtener información de un estudiante
      description: Obtener la información de un estudiante por su ID
      tags:
      - Estudiantes
      parameters:
      - name: id
        in: path
        required: true
        description: Número de cuenta del estudiante
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Información del estudiante obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Usuario autenticado exitosamente"
                  estudiante:
                    $ref: '#/components/schemas/Estudiante'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "Este usurio no existe"
                  estudiante:
                    type: null
                    example: null
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar la información de un estudiante
      description: Actualizar la información de un estudiante por su ID
      tags:
      - Estudiantes
      parameters:
      - name: id
        in: path
        required: true
        description: Número de cuenta del estudiante
        schema:
          type: string
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  description: Nombre del estudiante
                  example: "Pedro"
                apellido_paterno:
                  type: string
                  description: Apellido paterno del estudiante
                  example: "García"
                apellido_materno:
                  type: string
                  description: Apellido materno del estudiante
                  example: "López"
                email:
                  type: string
                  description: Correo electrónico del estudiante
                  example: "pedro.garcia@example.com"
                carrera:
                  type: string
                  description: Carrera que estudia el estudiante
                  example: "Ingeniería"
                semestre:
                  type: integer
                  description: Semestre que cursa el estudiante
                  example: 5
                grupo:
                  type: string
                  description: Grupo al que pertenece el estudiante
                  example: "A"
                ciclo_escolar:
                  type: string
                  description: Ciclo escolar actual
                  example: "2025-1"
      responses:
        '200':
          description: Información del estudiante actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Usuario autenticado exitosamente"
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "Este usurio no existe"
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /students/auth:
    post:
      summary: Autenticación de estudiante
      description: Autenticación de estudiantes para iniciar sesión
      tags:
      - Estudiantes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numero_cuenta:
                  type: string
                  description: Número de cuenta del estudiante
                  example: "20180123"
                nip:
                  type: string
                  description: NIP del estudiante
                  example: "1234"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Usuario autenticado exitosamente"
                  token:
                    type: string
                    example: "jwt-token"
                  estudiante:
                    $ref: '#/components/schemas/Estudiante'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 401
                  msg:
                    type: string
                    example: "La contraseña es incorrecta"
                  token:
                    type: null
                    example: null
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "Este usurio no existe"
                  token:
                    type: null
                    example: null
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Exam paths
  /exams:
    post:
      summary: Crear un nuevo examen
      tags:
      - Exámenes
      security:
      - BearerAuth: []
      requestBody:
        description: Datos del examen a crear
        content:
          application/json:
            schema:
              type: object
              properties:
                carrera:
                  type: string
                  description: Carrera o área del examen
                  example: "Ingeniería en Sistemas"
                nombre:
                  type: string
                  description: Nombre del examen
                  example: "Examen de Matemáticas"
                periodo:
                  type: string
                  description: Periodo o ciclo en el que se aplica el examen
                  example: "2025-1"
                duracion:
                  type: string
                  format: time
                  description: Duración del examen en formato de hora (hh:mm:ss)
                  example: "02:00:00"
      responses:
        '201':
          description: Examen creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: string
                    example: "Examen guardado exitosamente"
                  examen:
                    $ref: '#/components/schemas/Examen'
        '409':
          description: El examen ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 409
                  msg:
                    type: string
                    example: "Ya existe un examen con este título."
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Obtener todos los exámenes
      tags:
      - Exámenes
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Lista de exámenes obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: null
                  examenes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Examen'
        '404':
          description: No hay exámenes disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: "No hay exámenes disponibles"
                  examenes:
                    type: null
                    example: null
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exams/{id}:
    get:
      summary: Obtener detalles de un examen por ID
      tags:
      - Exámenes
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID del examen
        schema:
          type: integer
      responses:
        '201':
          description: Examen encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: null
                  examen:
