                              example: "Aprobados"
                            value:
                              type: number
                              example: 75
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: "Error en el servidor"
                  calificaciones:
                    type: array
                    items: []
                  resumen:
                    type: object
                    properties: {}

  # Admin Management paths
  /admin-managment:
    post:
      summary: Crear un nuevo administrador
      tags:
      - Admin Management
      security:
      - BearerAuth: []
      requestBody:
        description: Datos del administrador a crear
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan"
                apellido_paterno:
                  type: string
                  example: "Pérez"
                apellido_materno:
                  type: string
                  example: "García"
                numero_identificacion:
                  type: string
                  example: "A12345"
                nip:
                  type: string
                  example: "1234"
                carrera:
                  type: string
                  example: "Ingeniería en Sistemas"
      responses:
        '201':
          description: Administrador creado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 201
                  msg:
                    type: string
                    example: "Administrador creado exitosamente"
                  admin:
                    $ref: '#/components/schemas/Admin'
        '409':
          description: El administrador ya existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 409
                  msg:
                    type: string
                    example: "Este usuario ya existe"
        '500':
          description: Error en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Obtener todos los administradores
      tags:
      - Admin Management
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Lista de administradores obtenida con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  status:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: ""
                  administradores:
                    type: array
                    items:
                      $ref: '#/components/schemas/Admin'
        '404':
          description: No hay administradores disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 404
                  msg:
                    type: string
